<div class="container">
  @if (loading) {
    <app-loading />
  } @else {
    <div class="row m-2">
      <div class="col-8">
        <h1>Turmas</h1>
      </div>
    </div>


    <div class="d-flex justify-content-end">

      <input
        pInputText
        type="text"
        placeholder="Buscar"
        (input)="table.filterGlobal($event.target.value, 'contains')" />

    </div>

    <p-table
      #table
      [value]="turmas"
      dataKey="id"
      [paginator]=true
      [rows]=50
      [globalFilterFields]="['cod']"
      removableSort
      class="table"
      >


      <ng-template #header>
        <tr>
            <th pSortableColumn="id">
                #
                <p-sortIcon field="id"/>
            </th>
            <th pSortableColumn="cod">
              Nome
              <p-sortIcon field="cod"/>
            </th>
            <th>Nota Máxima</th>
            <th pSortableColumn="prof">
              Professor
              <p-sortIcon field="prof"/>
            </th>
            <th style = 'width: 20%; text-align: center;'>Ações</th>
        </tr>
      </ng-template>

      <ng-template #body let-turmaUntiped>
        @let turma = asTurmaAdm(turmaUntiped);
        <tr>
          <td style= 'text-align: center'>{{turma.id}}</td>
          <td>{{turma.cod}}</td>
          <td>{{turma.notaMax}}</td>
          <td>{{turma.professorNome}}</td>
          <td style= 'text-align: center'>
            <button type="button" class="btn btn-primary btn-sm mr-2 " (click)="editarTurmaProfessor(turma)" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
                <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
              </svg>
              Editar
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="8" class="text-center">
            <h4>Nenhuma Turma encontrada!</h4>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
